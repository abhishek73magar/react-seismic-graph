<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>react-seismic-graph examples</title>
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; color: #0f172a; background: #f8fafc; }
      main { max-width: 1200px; margin: 0 auto; padding: 16px; }
      nav { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
      nav button { border: 1px solid #cbd5e1; background: #fff; border-radius: 6px; padding: 6px 10px; cursor: pointer; }
      nav button[aria-pressed='true'] { background: #0284c7; color: #fff; border-color: #0284c7; }
      section { background: #fff; border: 1px solid #e2e8f0; padding: 12px; margin-bottom: 16px; }
      h2 { margin: 0 0 4px; font-size: 16px; }
      p { margin: 0 0 10px; color: #475569; font-size: 13px; }
      pre { background: #0f172a; color: #e2e8f0; padding: 10px; font-size: 12px; overflow-x: auto; }
      .code { background: #fff; border: 1px solid #e2e8f0; padding: 12px; margin-bottom: 16px; }
      .code summary { display: flex; align-items: center; justify-content: space-between; cursor: pointer; font-weight: 700; font-size: 14px; }
      .code summary button { border: 1px solid #cbd5e1; background: #fff; border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 12px; }
      .code pre { margin: 10px 0 0; line-height: 1.5; max-height: 70vh; }
      @media (max-width: 640px) { main { padding: 8px; } .code pre { font-size: 11px; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
